  </defs>
  <rect x="1" y="1" width="1278" height="518" rx="24" fill="url(#background)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
  <text x="48" y="56" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">How a request moves through Fusion</text>
  <text x="48" y="83" fill="#8494A8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Live IDA state for precision. SQLite state for fast repeated queries.</text>

  <path d="M256 244H344" stroke="url(#flow)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M584 244H666" stroke="url(#flow)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M930 191H1007" stroke="url(#flow)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M930 316H1007" stroke="url(#flow)" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(48 161)" filter="url(#soft)">
