      <text x="39" y="21" fill="#EDE9FE" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">payload.dll</text>
      <text x="39" y="36" fill="#74839B" font-family="Consolas, Courier New, monospace" font-size="10">SESSION case_2</text>
    </g>
    <g transform="translate(22 207)">
      <rect width="214" height="48" rx="10" fill="#0E1421" stroke="#C4B5FD" stroke-opacity="0.2"/>
