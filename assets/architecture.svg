      <text x="39" y="36" fill="#74839B" font-family="Consolas, Courier New, monospace" font-size="10">SESSION case_1</text>
    </g>
    <g transform="translate(22 149)">
      <rect width="214" height="48" rx="10" fill="#0E1421" stroke="#A78BFA" stroke-opacity="0.24"/>
