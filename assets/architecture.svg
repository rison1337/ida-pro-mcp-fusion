  <g transform="translate(1011 106)" filter="url(#soft)">
    <rect width="221" height="144" rx="18" fill="#182313" stroke="#FBBF24" stroke-opacity="0.42"/>
    <text x="20" y="34" fill="#FCD34D" font-family="Consolas, Courier New, monospace" font-size="12">LIVE ENGINE</text>
    <text x="20" y="65" fill="#FFFBEB" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">IDA + Hex-Rays</text>
    <text x="20" y="94" fill="#C8B991" font-family="Segoe UI, Arial, sans-serif" font-size="13">decompile · mutate</text>
    <text x="20" y="116" fill="#C8B991" font-family="Segoe UI, Arial, sans-serif" font-size="13">debug · inspect</text>
  </g>

  <g transform="translate(1011 276)" filter="url(#soft)">
    <rect width="221" height="144" rx="18" fill="#102623" stroke="#34D399" stroke-opacity="0.42"/>
    <text x="20" y="34" fill="#6EE7B7" font-family="Consolas, Courier New, monospace" font-size="12">PERSISTENT INDEX</text>
    <text x="20" y="65" fill="#ECFDF5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">SQLite cache</text>
    <text x="20" y="94" fill="#92C5B1" font-family="Segoe UI, Arial, sans-serif" font-size="13">xrefs · strings · funcs</text>
    <text x="20" y="116" fill="#92C5B1" font-family="Segoe UI, Arial, sans-serif" font-size="13">imports · call graph</text>
  </g>

  <g transform="translate(48 453)">
    <circle cx="7" cy="7" r="7" fill="#34D399"/>
    <text x="23" y="12" fill="#93A4B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Workers can outlive the supervisor and be adopted by the next connection.</text>
