      <text x="39" y="21" fill="#EDE9FE" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">more samples</text>
      <text x="39" y="36" fill="#74839B" font-family="Consolas, Courier New, monospace" font-size="10">DISCOVER / ADOPT</text>
    </g>
