    <text x="20" y="128" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Coding agent</text>
    <text x="20" y="151" fill="#8CA0B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">stdio or HTTP</text>
  </g>

