    <text x="22" y="67" fill="#F0FDFA" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Session supervisor</text>
    <rect x="22" y="91" width="190" height="34" rx="9" fill="#0B1918"/>
    <circle cx="41" cy="108" r="5" fill="#34D399"/>
    <text x="56" y="113" fill="#BEECE6" font-family="Segoe UI, Arial, sans-serif" font-size="13">route by database</text>
    <rect x="22" y="135" width="190" height="34" rx="9" fill="#0B1918"/>
    <circle cx="41" cy="152" r="5" fill="#5EEAD4"/>
    <text x="56" y="157" fill="#BEECE6" font-family="Segoe UI, Arial, sans-serif" font-size="13">worker lifecycle</text>
    <rect x="22" y="179" width="190" height="18" rx="9" fill="#0A1515"/>
